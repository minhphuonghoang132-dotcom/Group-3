<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreventAir AI · Interactive Technical Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0c1310; --panel:#131e1a; --panel2:#18251f; --line:#243329; --line2:#2f4137;
  --ink:#e7f0ec; --mid:#a6bab2; --dim:#7b918a;
  --teal:#2ec4a6; --teal-d:#1c8a75; --amber:#e9a93f; --red:#e2624a; --green:#5cc47f; --blue:#5aa9e6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101a16,#0c1310);position:sticky;top:0;z-index:40}
.hdr{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;font-size:16px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(46,196,166,.15)}
.logo span{color:var(--teal)}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-left:auto}
.lang button{background:none;border:0;color:var(--mid);font:inherit;font-size:12px;font-weight:650;padding:5px 12px;cursor:pointer}
.lang button.on{background:var(--teal);color:#ffffff}
nav{display:flex;gap:2px;flex-wrap:wrap;width:100%}
nav button{background:none;border:1px solid transparent;color:var(--mid);font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer}
nav button:hover{color:var(--ink);background:#18241f}
nav button.on{background:rgba(46,196,166,.12);color:var(--teal);border-color:rgba(46,196,166,.3)}
.page{display:none;padding-top:26px}
.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.t{font-size:20px;margin:0 0 4px}
p.sub{color:var(--mid);margin:0 0 20px;max-width:82ch}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g23{grid-template-columns:1.35fr 1fr}.g32{grid-template-columns:1fr 1.5fr}
.gmap{grid-template-columns:.85fr 1.15fr}
@media(max-width:900px){.g3,.g2,.g23,.g32,.gmap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 3px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card .hint{color:var(--dim);font-size:12px;margin:0 0 12px}
.tile .val{font-size:30px;font-weight:700;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.tile .cap{color:var(--mid);font-size:12.5px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.p-hi{background:rgba(226,98,74,.16);color:#ff8f76;border:1px solid rgba(226,98,74,.35)}
.p-md{background:rgba(233,169,63,.14);color:#f2bd67;border:1px solid rgba(233,169,63,.32)}
.p-lo{background:rgba(92,196,127,.14);color:#79d494;border:1px solid rgba(92,196,127,.3)}
.p-n{background:rgba(90,169,230,.13);color:#8cc6f2;border:1px solid rgba(90,169,230,.3)}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.layer .id{font-weight:700;font-size:12px;color:var(--dim)}
.layer .nm{font-size:13px}.layer .nm small{display:block;color:var(--dim);font-size:11.5px}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.st.ok{background:rgba(92,196,127,.14);color:#79d494}
.st.bad{background:rgba(226,98,74,.16);color:#ff8f76}
.st.unk{background:rgba(166,186,178,.12);color:var(--mid)}
label.ctl{display:block;margin:0 0 14px}
label.ctl .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mid);margin-bottom:5px}
label.ctl .lbl b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--teal);cursor:pointer;border:3px solid #0c1310;box-shadow:0 0 0 1px var(--teal)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--teal);cursor:pointer;border:3px solid #0c1310}
select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;margin-bottom:7px;font-size:13px}
.chk input{accent-color:var(--teal);width:15px;height:15px;cursor:pointer}
.chk .ce{margin-left:auto;font-size:11px;color:var(--dim)}
.chk.off{opacity:.55}
button.act{background:var(--teal);color:#ffffff;border:0;border-radius:8px;padding:9px 15px;font:inherit;font-weight:650;font-size:13px;cursor:pointer}
button.act:hover{background:#40d8b9}
button.ghost{background:transparent;color:var(--mid);border:1px solid var(--line2);border-radius:8px;padding:9px 15px;font:inherit;font-size:13px;cursor:pointer}
button.ghost:hover{color:var(--ink);border-color:var(--teal)}
button:disabled{opacity:.45;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--dim)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);border-left:2px solid var(--teal-d);padding-left:11px;margin-top:12px}
.tt{position:fixed;pointer-events:none;background:#08110e;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:12px;opacity:0;transition:opacity .12s;z-index:99;max-width:260px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
table.d{width:100%;border-collapse:collapse;font-size:12.5px}
table.d th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:7px 9px;border-bottom:1px solid var(--line2)}
table.d td{padding:8px 9px;border-bottom:1px solid var(--line)}
table.d tr:last-child td{border-bottom:0}
table.d tr.sel td{background:rgba(46,196,166,.08)}
table.d tbody tr{cursor:pointer}
table.d tbody tr:hover td{background:#18251f}
.phone{width:290px;border:1px solid var(--line2);border-radius:22px;background:#0a1411;padding:12px;margin:0 auto}
.phone .bar{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px 9px}
.msg{background:#152420;border:1px solid var(--line);border-radius:12px;border-top-left-radius:3px;padding:11px 12px;font-size:12.5px;margin-bottom:9px}
.msg .from{font-size:10.5px;color:var(--teal);font-weight:700;letter-spacing:.04em;margin-bottom:5px}
.msg .btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.msg .btns span{font-size:10.5px;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;color:var(--mid)}
.msg .btns span.pri{border-color:var(--teal);color:var(--teal)}
.msg.me{background:#10201b;border-top-left-radius:12px;border-top-right-radius:3px;margin-left:38px}
.tl{position:relative;padding-left:24px}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.step{position:relative;margin-bottom:14px;opacity:.32;transition:opacity .35s}
.step.on{opacity:1}
.step:before{content:'';position:absolute;left:-24px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);transition:all .35s}
.step.on:before{border-color:var(--teal);background:var(--teal);box-shadow:0 0 0 4px rgba(46,196,166,.16)}
.step .tm{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.04em}
.step .hd{font-size:13.5px;font-weight:650;margin:1px 0 2px}
.step .bd{font-size:12.5px;color:var(--mid)}
.step .tech{font-size:11px;color:var(--dim);margin-top:3px}
.plane{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:var(--panel)}
.plane .ph{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.plane .pn{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.plane .fpt{margin-left:auto;font-size:11px;color:var(--teal);border:1px solid rgba(46,196,166,.3);border-radius:999px;padding:2px 9px}
.boxes{display:flex;gap:7px;flex-wrap:wrap}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--mid)}
.arrow{text-align:center;color:var(--line2);font-size:16px;line-height:1;margin:-3px 0 6px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;color:var(--dim);font-size:11.5px}
.warnbox{background:rgba(233,169,63,.07);border:1px solid rgba(233,169,63,.25);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#f0cf95}

.prog{height:5px;border-radius:3px;background:#0f1a16;overflow:hidden;margin:2px 0 16px}
.prog i{display:block;height:100%;width:0;background:var(--teal);border-radius:3px;transition:width .12s linear}
.phases{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.phase{flex:1;min-width:96px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2);
  font-size:12px;color:var(--dim);transition:all .3s;text-align:center}
.phase.done{color:var(--mid);border-color:var(--line2)}
.phase.act{border-color:var(--teal);background:rgba(46,196,166,.12);color:var(--teal);font-weight:700}
.spd{display:flex;gap:3px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.spd button{background:none;border:0;color:var(--mid);font:inherit;font-size:11.5px;padding:6px 10px;cursor:pointer}
.spd button.on{background:var(--teal);color:#ffffff;font-weight:700}
.step.cur{opacity:1}
.step.cur .hd{color:var(--teal)}
.step.cur:before{box-shadow:0 0 0 6px rgba(46,196,166,.22)}
.capk{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.recbox{background:rgba(46,196,166,.09);border:1px solid rgba(46,196,166,.32);border-radius:9px;padding:11px 13px;font-size:13.5px;line-height:1.5}
.drvrow{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:7px}
.drvrow .dt{width:8px;height:8px;border-radius:50%;flex:none}
.scnbox{background:rgba(233,169,63,.08);border:1px solid rgba(233,169,63,.28);border-radius:9px;
  padding:10px 13px;font-size:12.8px;color:#eccd93;margin-bottom:4px}
/* ---------- CCTV ---------- */
.camwrap{position:relative;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line2)}
.camwrap svg{display:block}
.banner{position:absolute;left:12px;top:44px;display:flex;align-items:center;gap:8px;
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;
  backdrop-filter:blur(3px);transition:opacity .3s}
.banner.bad{background:rgba(226,98,74,.9);color:#160604}
.banner.ok{background:rgba(92,196,127,.92);color:#04160b}
.banner.warn{background:rgba(233,169,63,.92);color:#1a1204}
.banner .bdot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:bp 1.2s infinite}
@keyframes bp{50%{opacity:.2}}
.camctl{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.camctl button{background:var(--panel2);border:1px solid var(--line2);color:var(--mid);font:inherit;font-size:12px;
  padding:6px 12px;border-radius:999px;cursor:pointer}
.camctl button:hover{color:var(--ink);border-color:var(--teal)}
.camctl button.on{background:rgba(46,196,166,.14);border-color:var(--teal);color:var(--teal)}
.det{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.det:last-child{border-bottom:0}
.det .cls{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12.5px;min-width:132px}
.det .bar{flex:1;height:6px;border-radius:3px;background:#0f1a16;overflow:hidden}
.det .bar i{display:block;height:100%;border-radius:3px}
.det .cf{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12px;width:34px;text-align:right;color:var(--mid)}
.det .lay{font-size:10.5px;border:1px solid var(--line2);border-radius:5px;padding:2px 6px;color:var(--dim)}
/* ---------- before / after ---------- */
.ba{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#000}
.ba .lay2{position:absolute;inset:0}
.ba .lay2 svg{width:100%;height:100%}
.ba .divider{position:absolute;top:0;bottom:0;width:2px;background:var(--teal);pointer-events:none;box-shadow:0 0 12px rgba(46,196,166,.6)}
.ba .knob{position:absolute;top:50%;width:34px;height:34px;margin-left:-17px;margin-top:-17px;border-radius:50%;
  background:var(--teal);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;pointer-events:none}
.ba input[type=range]{position:absolute;inset:auto 0 0 0;top:0;height:100%;width:100%;opacity:0;cursor:ew-resize;margin:0}
.batag{position:absolute;bottom:40px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.03em}
.batag.l{left:12px;background:rgba(226,98,74,.9);color:#160604}
.batag.r{right:12px;background:rgba(92,196,127,.92);color:#04160b}

/* system map */
.stage{display:grid;grid-template-columns:40px 1fr;gap:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);
  padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.stage:hover{border-color:var(--line2);background:var(--panel2)}
.stage.on{border-color:var(--teal);background:rgba(46,196,166,.07)}
.stage .code{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--teal)}
.stage.on .code{background:var(--teal);color:#ffffff;border-color:var(--teal)}
.stage .nm{font-size:13.5px;font-weight:650;line-height:1.35}
.stage .one{font-size:12px;color:var(--dim);margin-top:2px}
.conn{height:14px;margin-left:35px;border-left:2px dashed var(--line2)}
.detail h4{margin:16px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);font-weight:700}
.detail ul{margin:0;padding-left:17px}
.detail li{font-size:12.8px;color:var(--mid);margin-bottom:5px;line-height:1.55}
.detail li b{color:var(--ink)}
.detail .steps li{color:var(--ink)}
.mono-out{background:#0f1a16;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11.5px;color:#9fd8c9;overflow-x:auto}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pillrow .mini{font-size:11px;color:var(--mid);border:1px solid var(--line2);border-radius:7px;padding:4px 9px}
.pillrow .mini b{color:var(--teal)}

/* ============================ visual polish ============================ */
:root{
  --bg:#070d0b; --panel:#0f1a16; --panel2:#14211c;
  --line:#1d2b25; --line2:#2b3f36;
  --ink:#eaf2ee; --mid:#a8bdb5; --dim:#7b918a;
  --teal:#3ad4b4; --teal-d:#1a8f78;
}
html{scroll-behavior:smooth}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1100px 560px at 12% -12%, rgba(58,212,180,.10), transparent 62%),
    radial-gradient(900px 520px at 96% -6%, rgba(90,169,230,.055), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  letter-spacing:-0.005em;
}
.mono,.det .cls{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
::selection{background:rgba(58,212,180,.28);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22322b;border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#2e453b}

.wrap{max-width:1280px;padding:0 24px 76px}
header{background:linear-gradient(180deg,rgba(15,26,22,.94),rgba(7,13,11,.86));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr{max-width:1280px;padding:15px 24px;gap:16px}
.logo{font-size:16.5px;letter-spacing:-.015em;gap:11px}
.mark{display:flex;filter:drop-shadow(0 4px 12px rgba(58,212,180,.30))}
.tag{border-color:var(--line2);color:var(--mid);font-size:11.5px;padding:4px 12px;background:rgba(255,255,255,.02)}
nav{gap:4px;margin-top:2px}
nav button{padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:500;
  border:1px solid transparent;transition:all .22s cubic-bezier(.4,0,.2,1)}
nav button:hover{background:rgba(255,255,255,.035);color:var(--ink)}
nav button.on{background:linear-gradient(180deg,rgba(58,212,180,.20),rgba(58,212,180,.07));
  border-color:rgba(58,212,180,.34);color:#82f0d7;box-shadow:0 8px 20px -14px rgba(58,212,180,.95)}
.lang{border-color:var(--line2);border-radius:9px}
.lang button{padding:6px 13px;transition:all .2s}
.lang button.on{background:linear-gradient(180deg,#48ddbd,#20b195);color:#ffffff}

.page{padding-top:30px}
h2.t{position:relative;padding-left:17px;font-size:23px;font-weight:700;letter-spacing:-.018em}
h2.t:before{content:'';position:absolute;left:0;top:.24em;width:4px;height:1em;border-radius:3px;
  background:linear-gradient(180deg,var(--teal),rgba(58,212,180,.18))}

.grid{gap:16px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.030),rgba(255,255,255,0) 42%),var(--panel);
  border:1px solid var(--line);border-radius:15px;padding:19px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045), 0 24px 48px -36px rgba(0,0,0,.95);
  transition:border-color .28s ease}
.card:hover{border-color:var(--line2)}
.card h3{font-size:11.5px;letter-spacing:.1em;color:var(--dim);font-weight:600}
.card .hint{font-size:12.5px;line-height:1.6;color:var(--dim)}

.tile .val{font-size:36px;letter-spacing:-.03em;margin:9px 0 4px}
.tile .cap{font-size:12.5px;color:var(--mid)}
.pill{padding:3.5px 10px;font-size:10.5px;letter-spacing:.07em}

.layer{border-radius:11px;padding:11px 13px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent),var(--panel2);
  transition:border-color .2s}
.layer:hover{border-color:var(--line2)}
.st{padding:3.5px 9px;border-radius:7px}

button.act{background:linear-gradient(180deg,#4ce0c0,#1eb394);border-radius:10px;padding:10px 17px;
  font-weight:650;box-shadow:0 10px 24px -14px rgba(58,212,180,.95);transition:filter .2s,transform .12s}
button.act:hover{filter:brightness(1.08);background:linear-gradient(180deg,#4ce0c0,#1eb394)}
button.act:active{transform:translateY(1px)}
button.ghost{border-radius:10px;padding:10px 16px;transition:all .2s;background:rgba(255,255,255,.018)}
button.ghost:hover{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line2)}

table.d th{font-size:10.5px;letter-spacing:.09em;padding:9px 11px;border-bottom:1px solid var(--line2)}
table.d td{padding:11px 11px;border-bottom:1px solid rgba(255,255,255,.045)}
table.d tbody tr{transition:background .18s}

<script>
/* ============================================================
   Simulated construction-site CCTV frame, drawn as SVG.
   No photography is used. Everything here is synthetic and the
   frame is watermarked as a simulation.
   ============================================================ */
const SC = (() => {
  const W = 960, H = 540;
  const COL = { ok:'#57d08a', bad:'#ff6a4d', warn:'#f0b13f', scan:'#5ab6ee' };

  function rnd(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }

  function defs(){
    return `<defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9db2c2"/><stop offset="70%" stop-color="#c8cfcb"/><stop offset="100%" stop-color="#dcded4"/></linearGradient>
      <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b3a288"/><stop offset="100%" stop-color="#847a6a"/></linearGradient>
      <linearGradient id="tarp" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3fa0d0"/><stop offset="55%" stop-color="#2a7ba4"/><stop offset="100%" stop-color="#3a95c4"/></linearGradient>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b2946b"/><stop offset="100%" stop-color="#7b6446"/></linearGradient>
      <radialGradient id="vig" cx="50%" cy="48%" r="72%">
        <stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.30"/></radialGradient>
      <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
        <rect width="3" height="1.1" fill="#000" opacity="0.08"/></pattern>
      <pattern id="ribs" width="15" height="70" patternUnits="userSpaceOnUse">
        <rect width="15" height="70" fill="#2b6ea3"/><rect x="12" width="3" height="70" fill="#22587f"/>
        <rect x="0" width="2" height="70" fill="#3a83bd"/></pattern>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
        <feColorMatrix type="saturate" values="0"/></filter>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>`;
  }

  function backdrop(){
    let s = `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
    // distant skyline
    const b = [[20,108,54],[80,86,40],[126,120,64],[196,96,46],[248,74,72],[326,112,50],[382,92,58],[446,120,44],[496,80,66],[566,104,52],[624,88,60],[690,116,48],[744,96,56],[806,110,62],[874,84,50]];
    b.forEach(([x,h,w],i)=>{
      s += `<rect x="${x}" y="${186-h}" width="${w}" height="${h}" fill="#5d6a74" opacity="${0.55+0.2*rnd(i)}"/>`;
      for(let r=0;r<Math.floor(h/16);r++) for(let c=0;c<Math.floor(w/14);c++)
        if(rnd(i*40+r*7+c)>0.55) s += `<rect x="${x+6+c*14}" y="${186-h+8+r*16}" width="5" height="6" fill="#c9cfae" opacity="0.35"/>`;
    });
    // tower crane
    s += `<g stroke="#7f8a92" stroke-width="3" fill="none" opacity="0.85">
      <path d="M812,186 L812,44"/><path d="M700,52 L900,52"/><path d="M812,44 L812,52"/>
      <path d="M760,52 L812,20 L864,52"/><path d="M756,52 L756,72"/></g>`;
    // haze band
    s += `<rect y="120" width="${W}" height="76" fill="#e6e6de" opacity="0.28"/>`;
    // public road behind the hoarding
    s += `<rect y="186" width="${W}" height="62" fill="#4b4f52"/>`;
    s += `<rect y="186" width="${W}" height="4" fill="#5d6165"/>`;
    for(let x=0;x<W;x+=54) s += `<rect x="${x}" y="216" width="26" height="3" fill="#9aa0a3" opacity="0.5"/>`;
    // a motorbike on the road
    s += `<g opacity="0.9"><ellipse cx="196" cy="232" rx="16" ry="4" fill="#000" opacity="0.25"/>
      <circle cx="186" cy="228" r="6" fill="#26292b"/><circle cx="208" cy="228" r="6" fill="#26292b"/>
      <path d="M184,226 L198,214 L210,226" stroke="#b8452f" stroke-width="4" fill="none"/>
      <circle cx="199" cy="207" r="5" fill="#3f4b57"/></g>`;
    return s;
  }

  function hoarding(){
    // blue tin site hoarding, gate opening on the right
    let s = '';
    s += `<rect x="0" y="240" width="700" height="68" fill="url(#ribs)"/>`;
    s += `<rect x="0" y="236" width="700" height="7" fill="#5fa5db"/>`;
    s += `<rect x="0" y="303" width="700" height="6" fill="#123c58" opacity="0.7"/>`;
    // open gate leaf, swung inward
    s += `<g transform="translate(886,236) skewY(9)"><rect x="0" y="0" width="118" height="70" fill="url(#ribs)"/>
      <rect x="0" y="-4" width="118" height="7" fill="#4f95cb"/></g>`;
    // gate posts
    s += `<rect x="694" y="226" width="11" height="90" fill="#1d4a6b"/><rect x="878" y="226" width="11" height="90" fill="#1d4a6b"/>`;
    // site notice board on the fence
    s += `<rect x="60" y="252" width="76" height="46" fill="#e8e4d8" opacity="0.9"/>
      <rect x="66" y="258" width="64" height="6" fill="#c0392b" opacity="0.8"/>
      ${[0,1,2,3].map(i=>`<rect x="66" y="${270+i*7}" width="${64-i*9}" height="3" fill="#7b8286" opacity="0.7"/>`).join('')}`;
    return s;
  }

  function ground(){
    let s = `<rect y="308" width="${W}" height="${H-308}" fill="url(#grd)"/>`;
    for(let i=0;i<26;i++){
      const x = rnd(i*3.1)*W, y = 320 + rnd(i*7.7)*200, r = 12 + rnd(i*5.3)*46;
      s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r.toFixed(0)}" ry="${(r*0.34).toFixed(0)}" fill="#6d6252" opacity="${(0.14+rnd(i)*0.18).toFixed(2)}"/>`;
    }
    // tyre tracks curving to the gate
    s += `<g stroke="#7d7060" stroke-width="7" fill="none" opacity="0.5">
      <path d="M40,528 C320,486 620,452 780,428"/><path d="M76,540 C360,500 660,468 812,444"/></g>`;
    return s;
  }

  function heap(covered){
    const mound = 'M286,462 C324,344 444,306 536,322 C614,336 652,398 672,462 Z';
    let s = `<ellipse cx="478" cy="464" rx="206" ry="22" fill="#000" opacity="0.20"/>`;
    if(covered){
      s += `<path d="${mound}" fill="url(#tarp)"/>`;
      s += `<g stroke="#12536f" stroke-width="2.6" fill="none" opacity="0.65">
        <path d="M328,440 C392,356 486,330 566,360"/><path d="M304,458 C384,390 486,356 616,400"/>
        <path d="M424,314 C430,366 434,414 436,462"/><path d="M532,330 C538,380 544,418 548,462"/></g>`;
      s += `<g fill="#e3d6b6" opacity="0.95">${[0,1,2,3,4,5].map(i=>`<ellipse cx="${306+i*70}" cy="${462-Math.abs(i-2.5)*3}" rx="22" ry="9"/>`).join('')}</g>`;
    } else {
      s += `<path d="${mound}" fill="url(#soil)"/>`;
      s += `<path d="M286,462 C332,362 442,318 536,322 C500,362 438,398 400,462 Z" fill="#cbab7c" opacity="0.5"/>`;
      for(let i=0;i<44;i++){
        const t = rnd(i*2.7), u = rnd(i*9.1);
        const x = 312 + t*336, y = 340 + u*112 + Math.abs(t-0.45)*74;
        s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.2+rnd(i)*2.6).toFixed(1)}" fill="#4a3c2a" opacity="0.5"/>`;
      }
    }
    return s;
  }

  function excavator(){
    return `<g transform="translate(44,336) scale(0.82)">
      <ellipse cx="60" cy="112" rx="72" ry="10" fill="#000" opacity="0.25"/>
      <rect x="4" y="88" width="116" height="22" rx="10" fill="#2b2f33"/>
      ${[0,1,2,3,4].map(i=>`<circle cx="${20+i*22}" cy="99" r="7" fill="#4a5157"/>`).join('')}
      <rect x="24" y="52" width="78" height="40" rx="6" fill="#d3a733"/>
      <rect x="34" y="58" width="34" height="24" rx="3" fill="#26333d" opacity="0.85"/>
      <rect x="96" y="60" width="18" height="30" rx="4" fill="#b8912a"/>
      <g stroke="#d3a733" stroke-width="11" fill="none" stroke-linecap="round">
        <path d="M100,66 L152,18"/><path d="M152,18 L186,62"/></g>
      <path d="M180,58 L206,52 L212,80 L184,84 Z" fill="#a8842a"/>
    </g>`;
  }

  function truck(sheeted){
    let s = `<g transform="translate(704,234)">
      <ellipse cx="96" cy="84" rx="96" ry="9" fill="#000" opacity="0.3"/>
      <rect x="8" y="26" width="104" height="46" rx="4" fill="#3f4a55"/>
      <rect x="112" y="18" width="66" height="54" rx="5" fill="#7a4230"/>
      <rect x="122" y="26" width="42" height="22" rx="3" fill="#9fc3d6" opacity="0.85"/>
      <circle cx="40" cy="76" r="13" fill="#1e2226"/><circle cx="40" cy="76" r="5" fill="#4b5157"/>
      <circle cx="92" cy="76" r="13" fill="#1e2226"/><circle cx="92" cy="76" r="5" fill="#4b5157"/>
      <circle cx="156" cy="76" r="13" fill="#1e2226"/><circle cx="156" cy="76" r="5" fill="#4b5157"/>`;
    if(sheeted){
      s += `<path d="M10,26 C40,10 84,10 110,26 Z" fill="#1d5f80"/>
            <path d="M10,26 C40,10 84,10 110,26" stroke="#0f4560" stroke-width="2" fill="none"/>`;
    } else {
      s += `<path d="M12,26 C36,8 78,6 108,26 Z" fill="#6d5a44"/>
            ${[0,1,2,3,4,5,6].map(i=>`<circle cx="${22+i*13}" cy="${20+rnd(i)*8}" r="${2+rnd(i*3)*2}" fill="#4a3c2a" opacity="0.7"/>`).join('')}`;
    }
    return s + `</g>`;
  }

  function washbay(){
    return `<g>
      <rect x="700" y="430" width="238" height="76" rx="6" fill="#2a3439"/>
      <rect x="710" y="440" width="218" height="56" rx="4" fill="#4b7f90" opacity="0.92"/>
      ${[0,1,2,3,4,5].map(i=>`<ellipse cx="${736+i*36}" cy="${458+ (i%2)*20}" rx="17" ry="5" fill="#9ccddb" opacity="0.4"/>`).join('')}
      <rect x="700" y="426" width="238" height="6" fill="#55666d"/>
      <g stroke="#9aa6ab" stroke-width="4"><path d="M708,430 L708,392"/><path d="M930,430 L930,392"/></g>
      <path d="M708,394 L930,394" stroke="#9aa6ab" stroke-width="4"/>
    </g>`;
  }

  function misters(on){
    let s = `<g stroke="#8f9aa1" stroke-width="4">
      <path d="M250,314 L250,246"/><path d="M640,314 L640,246"/></g>`;
    if(on){
      [250,640].forEach((x,k)=>{
        s += `<g filter="url(#soft2)" opacity="0.55">`;
        for(let i=0;i<16;i++){
          const a = -0.35 + rnd(i+k*9)*0.7, r = 40 + rnd(i*3+k)*86;
          s += `<circle cx="${(x+Math.sin(a)*r).toFixed(0)}" cy="${(250+Math.abs(Math.cos(a))*r*0.55).toFixed(0)}" r="${(5+rnd(i*7)*9).toFixed(0)}" fill="#eef4f6"/>`;
        }
        s += `</g>`;
        s += `<ellipse cx="${x}" cy="${372}" rx="86" ry="22" fill="#2f3b36" opacity="0.30"/>`;
      });
    }
    return s;
  }

  function workers(){
    return `<g>
      ${[[196,486],[236,474]].map(([x,y])=>`<g transform="translate(${x},${y})">
        <ellipse cx="0" cy="30" rx="12" ry="4" fill="#000" opacity="0.3"/>
        <rect x="-7" y="0" width="14" height="20" rx="4" fill="#e8631f"/>
        <rect x="-6" y="19" width="5" height="12" fill="#2f3a44"/><rect x="1" y="19" width="5" height="12" fill="#2f3a44"/>
        <circle cx="0" cy="-6" r="6" fill="#d9b48c"/><path d="M-7,-8 A7,7 0 0 1 7,-8 Z" fill="#f0c020"/></g>`).join('')}
    </g>`;
  }

  function dust(level, drift){
    if(level <= 0.02) return '';
    const n = Math.round(5 + level*9);
    let s = `<g filter="url(#soft)">`;
    for(let i=0;i<n;i++){
      const t = i/(n-1||1);
      const x = 452 + t*270*(0.5+drift) ;
      const y = 392 - t*150 + (rnd(i*8.2)-0.5)*40;
      const r = 34 + t*62 + rnd(i*2.2)*20;
      s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r.toFixed(0)}" ry="${(r*0.58).toFixed(0)}" fill="#e5d8bd" opacity="${(0.08+level*0.20).toFixed(2)}"/>`;
    }
    s += `</g>`;
    for(let i=0;i<Math.round(level*34);i++){
      const t = rnd(i*1.7);
      const x = 440 + t*300*(0.5+drift), y = 372 - t*120 + rnd(i*5.5)*80;
      s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(0.7+rnd(i)*1.6).toFixed(1)}" fill="#efe6d2" opacity="${(0.2+level*0.34).toFixed(2)}"/>`;
    }
    return s;
  }

  function boxes(list, lang){
    if(!list || !list.length) return '';
    return list.map(b=>{
      const c = COL[b.state] || COL.scan, L = 20;
      const dash = b.state === 'scan' ? ' stroke-dasharray="7 6"' : '';
      const label = `${b.label} ${b.conf!=null ? b.conf.toFixed(2) : ''}`.trim();
      const lw = label.length * 6.9 + 18;
      return `<g>
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${c}" opacity="0.07"/>
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="${c}" stroke-width="1.4" opacity="0.55"${dash}/>
        <g stroke="${c}" stroke-width="3.4" fill="none" stroke-linecap="square">
          <path d="M${b.x},${b.y+L} L${b.x},${b.y} L${b.x+L},${b.y}"/>
          <path d="M${b.x+b.w-L},${b.y} L${b.x+b.w},${b.y} L${b.x+b.w},${b.y+L}"/>
          <path d="M${b.x+b.w},${b.y+b.h-L} L${b.x+b.w},${b.y+b.h} L${b.x+b.w-L},${b.y+b.h}"/>
          <path d="M${b.x+L},${b.y+b.h} L${b.x},${b.y+b.h} L${b.x},${b.y+b.h-L}"/></g>
        <rect x="${b.x}" y="${b.below ? b.y+b.h+3 : b.y-23}" width="${lw}" height="21" rx="3" fill="${c}"/>
        <text x="${b.x+9}" y="${b.below ? b.y+b.h+18 : b.y-8}" font-size="12.5" font-weight="700" fill="#08130f" font-family="Inter, Arial">${label}</text>
      </g>`;
    }).join('');
  }

  function hud(o, lang){
    const sim = lang==='vi' ? 'HÌNH MÔ PHỎNG' : 'SIMULATED VIEW';
    const smp = lang==='vi' ? '1920×1080 · lấy mẫu 1 fps' : '1920×1080 · sampled at 1 fps';
    return `<g font-family="'SF Mono', Consolas, monospace">
      <rect x="0" y="0" width="${W}" height="${H}" fill="url(#scan)"/>
      <rect x="0" y="0" width="${W}" height="${H}" filter="url(#grain)" opacity="0.055"/>
      <rect x="0" y="0" width="${W}" height="${H}" fill="url(#vig)"/>
      <rect x="0" y="0" width="${W}" height="34" fill="#000" opacity="0.42"/>
      <rect x="0" y="${H-30}" width="${W}" height="30" fill="#000" opacity="0.42"/>
      <circle cx="22" cy="17" r="6" fill="#e2624a"><animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="38" y="22" fill="#e9eeec" font-size="14" font-weight="700">${o.cam}</text>
      <text x="${W-16}" y="22" fill="#e9eeec" font-size="14" text-anchor="end">2026-08-12  ${o.time}</text>
      <text x="16" y="${H-10}" fill="#c9d3cf" font-size="12">${smp}</text>
      <text x="${W-16}" y="${H-10}" fill="#c9d3cf" font-size="12" text-anchor="end" letter-spacing="1.5">${sim}</text>
    </g>`;
  }

  let UID = 0;
  function frame(o, lang){
    o = Object.assign({covered:false, spraying:false, sheeted:true, dust:0, drift:0.4,
                       boxes:[], time:'14:22:07', cam:'CAM-02 · NORTH YARD'}, o||{});
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;border-radius:10px">
      ${defs()}${backdrop()}${hoarding()}${truck(o.sheeted)}${ground()}${washbay()}
      ${heap(o.covered)}${excavator()}${misters(o.spraying)}${workers()}
      ${dust(o.dust, o.drift)}${hud(o, lang)}${boxes(o.boxes, lang)}
    </svg>`;
    // unique paint-server ids per frame: several frames coexist on one page and
    // a reference into a display:none subtree does not resolve.
    const u = '_f' + (++UID);
    ['soft2','sky','grd','tarp','soil','vig','scan','ribs','grain','soft'].forEach(id=>{
      svg = svg.split('id="'+id+'"').join('id="'+id+u+'"').split('url(#'+id+')').join('url(#'+id+u+')');
    });
    return svg;
  }

  // canonical detection sets -------------------------------------------------
  const BOX = {
    heap:      {x:278, y:300, w:402, h:170},
    fence:     {x:14,  y:228, w:676, h:86},
    truck:     {x:700, y:226, w:198, h:98},
    wash:      {x:692, y:388, w:252, h:124},
    dustzone:  {x:432, y:236, w:396, h:180},
    mist:      {x:572, y:230, w:152, h:172},
  };
  return { frame, BOX, COL, W, H };
})();

const FC=(()=>{const a=[];const base=[.08,.06,.05,.05,.06,.09,.14,.18,.22,.26,.3,.34,.4,.46,.5,.44,.36,.3,.22,.16,.12,.1,.09,.08];
  for(let d=0;d<2;d++)for(let h=0;h<24;h++){let p=base[h]*(d?1.45:1)+(d&&h>=13&&h<=16?.28:0);
    a.push({h,d,p:Math.max(.03,p+(Math.sin(h*1.7+d)*0.03))});}
  const mx=Math.max(...a.map(x=>x.p)); a.forEach(x=>{x.p=x.p*(0.71/mx);}); return a;})();

function pOf(keep,ef,fw,gm,hs){const f=ef*fw*gm*hs*keep;return 1/(1+Math.exp(-(2.05*(Math.log(Math.max(f,1e-4))+0.21))));}
function calc(){
  simAct=$('#i_act').value;
  const area=+$('#i_area').value,u=+$('#i_u').value,dir=+$('#i_dir').value,rh=+$('#i_rh').value,blh=+$('#i_blh').value,rain=$('#i_rain').checked;
  $('#v_area').textContent=num(area.toLocaleString('en-US'))+' m²';
  $('#v_u').textContent=num(u.toFixed(1))+' m/s';
  $('#v_dir').textContent=String(dir).padStart(3,'0')+'°';
  $('#v_rh').textContent=rh+'%';
  $('#v_blh').textContent=num(blh.toLocaleString('en-US'))+' m';
  const efc=ACT.find(a=>a[0]===simAct)[2];
  const ef=efc*Math.pow(area/2400,0.55);
  const fw=u<1.2?0.25:Math.min(3.2,Math.pow(u/3.0,1.6));
  const gm=rain?0.22:Math.max(0.5,Math.min(1.12,1.18-0.0075*(rh-35)));
  const hs=Math.max(0.6,Math.min(1.8,1200/blh*0.9));
  let keep=1; CTRL.forEach(([id,,ce])=>{ if(cState[id]) keep*=(1-ce); });
  const ce=1-keep, fdpi=ef*fw*gm*hs*keep;
  const p=1/(1+Math.exp(-(2.05*(Math.log(Math.max(fdpi,1e-4))+0.21))));
  const reach=Math.round(Math.min(1400,120+u*95*Math.min(1.6,fdpi+0.3)));
  $('#o_p').textContent=(p*100).toFixed(0)+'%'; $('#o_p').style.color=bandColor(p);
  $('#o_band').innerHTML=`<span class="pill ${p>=.6?'p-hi':p>=.3?'p-md':'p-lo'}">${bandName(p)}</span>`;
  $('#o_fdpi').textContent=num(fdpi.toFixed(3)); $('#o_ef').textContent=num(ef.toFixed(2));
  $('#o_fw').textContent=num(fw.toFixed(2)); $('#o_gm').textContent=num(gm.toFixed(2));
  $('#o_hs').textContent=num(hs.toFixed(2)); $('#o_ce').textContent=(ce*100).toFixed(0)+'%';
  $('#o_reach').textContent=num(reach.toLocaleString('en-US'))+' m';
  drawPlume(dir,reach,p,u);
  renderCamSim(p,dir);
  // plain-language drivers
  const onCount=CTRL.filter(([id])=>cState[id]).length;
  $('#o_drv').innerHTML=plainDrivers(u,area,rain,rh,onCount).slice(0,4).map(([txt,up])=>
    `<div class="drvrow"><span class="dt" style="background:${up?C.red:C.green}"></span><span>${tv(txt)}</span></div>`).join('');
  // recommended action
  let best=null;
  CTRL.forEach(([id,nm,ce])=>{ if(!cState[id]){
    let k=1; CTRL.forEach(([id2,,ce2])=>{ if(cState[id2]||id2===id) k*=(1-ce2); });
    const p2=pOf(k,ef,fw,gm,hs);
    if(!best||p2<best.p2) best={id,nm,p2};
  }});
  let rec;
  if(p<0.3) rec=t('sim.adv0');
  else if(best&&best.p2<p-0.04) rec=`<b>${tv(best.nm)}</b><br><span style="color:var(--mid)">${t('sim.advfrom')} ${(p*100)|0}% → <b style="color:${bandColor(best.p2)}">${(best.p2*100)|0}%</b></span>`;
  else rec=`<b>${t('sim.adv3')}</b><br><span style="color:var(--mid)">${t('sim.adv3h')}</span>`;
  $('#o_rec').innerHTML=rec;
  drawDrivers([[['Activity × area','Hoạt động × diện tích'],ef],[['Wind f(u)','Gió f(u)'],fw],[['Moisture g(RH,P)','Ẩm g(RH,P)'],gm],
               [['Stability h(BLH)','Ổn định h(BLH)'],hs],[['Controls (1−CE)','Kiểm soát (1−CE)'],keep]]);
  const to=(dir+180)%360, half=Math.max(12,34-u*1.4);
  const hit=RECEPTORS.filter(r=>{let dd=Math.abs(((r.b-to+540)%360)-180);return dd<=half&&r.d<=reach;});
  $('#recept').innerHTML=hit.length
    ? `<b style="color:${bandColor(p)}">${hit.length} ${t('sim.rin')}</b><br>`+hit.map(r=>`· ${tv(r.n)} <span class="mono" style="color:var(--dim)">${r.d} m</span>`).join('<br>')
    : `<span style="color:var(--green)">${t('sim.rnone')}</span>`;
}
function drawPlume(dir,reach,p,u){
  const S=250,cx=S/2,cy=S/2;
  const s=el('svg',{viewBox:`0 0 ${S} ${S}`,width:'100%',style:'display:block;max-width:280px'});
  el('rect',{x:0,y:0,width:S,height:S,fill:'#f3f7fd',rx:10},s);
  [40,80,110].forEach(r=>el('circle',{cx,cy,r,fill:'none',stroke:C.line,'stroke-width':1},s));
  const comp=LANG==='en'?['N','E','S','W']:['B','Đ','N','T'];
  comp.forEach((tx,i)=>{const a=i*90*Math.PI/180;
    el('text',{x:cx+Math.sin(a)*118,y:cy-Math.cos(a)*118+3.5,fill:C.dim,'font-size':9,'text-anchor':'middle'},s).textContent=tx;});
  const to=(dir+180)%360, half=Math.max(12,34-u*1.4), R=Math.min(112,reach/1400*112+18);
  const pt=(ang,r)=>[cx+Math.sin(ang*Math.PI/180)*r, cy-Math.cos(ang*Math.PI/180)*r];
  const [x1,y1]=pt(to-half,R),[x2,y2]=pt(to+half,R);
  const g=el('radialGradient',{id:'pg',cx:'50%',cy:'50%',r:'50%'},s);
  el('stop',{offset:'0%','stop-color':bandColor(p),'stop-opacity':.55},g);
  el('stop',{offset:'100%','stop-color':bandColor(p),'stop-opacity':.05},g);
  el('path',{d:`M${cx},${cy} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z`,fill:'url(#pg)',stroke:bandColor(p),'stroke-width':1,'stroke-opacity':.5},s);
  RECEPTORS.forEach(r=>{const rr=Math.min(112,r.d/1400*112+18),[x,y]=pt(r.b,rr);
    let dd=Math.abs(((r.b-to+540)%360)-180); const inside=dd<=half&&r.d<=reach;
    el('circle',{cx:x,cy:y,r:r.w+1.5,fill:inside?bandColor(p):C.line2,stroke:inside?'#fff':'none','stroke-width':.6,'stroke-opacity':.5},s);});
  el('circle',{cx,cy,r:5,fill:C.teal},s); el('circle',{cx,cy,r:9,fill:'none',stroke:C.teal,'stroke-opacity':.4},s);
  const [ax,ay]=pt(dir,124),[bx,by]=pt(dir,100);
  el('line',{x1:ax,y1:ay,x2:bx,y2:by,stroke:C.blue,'stroke-width':2},s); el('circle',{cx:bx,cy:by,r:3,fill:C.blue},s);
  $('#plume').innerHTML=''; $('#plume').appendChild(s);
}
function drawDrivers(pairs){

    const amp=Math.log(Math.max(v,0.02)), pct=Math.min(100,Math.abs(amp)/1.6*100), pos=amp>=0;
    return `<div style="display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin-bottom:7px">
      <div style="font-size:12px;color:var(--mid)">${tv(k)}</div>
      <div style="height:8px;background:#e4eaf3;border-radius:4px;position:relative;overflow:hidden">
        <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)"></div>
        <div style="position:absolute;top:0;bottom:0;${pos?'left:50%':'right:50%'};width:${pct/2}%;background:${pos?C.red:C.green};border-radius:4px;opacity:.8"></div></div>
      <div class="mono" style="font-size:11.5px;text-align:right;color:${pos?'#ff9b84':'#79d494'}">×${num(v.toFixed(2))}</div></div>`;
  }).join('')+`<div style="font-size:11px;color:var(--dim);margin-top:8px">${t('sim.amp')}</div>`;
}

function cand(){
  const from=50,half=38;
  return SITES.map(st=>{const dx=st.x-NODE.x,dy=NODE.y-st.y;
    const b=(Math.atan2(dx,dy)*180/Math.PI+360)%360, d=Math.hypot(dx,dy);
    const off=Math.abs(((b-from+540)%360)-180), inC=off<=half&&d<=200;
    return {...st,post:inC?Math.max(.05,(1-off/half*.55)*(1-d/300)):0,inC,d:Math.round(d)};
  }).filter(x=>x.inC).sort((a,b)=>b.post-a.post);
}

function stopPlay(){ playing=false; clearInterval(rt); rt=null; playBtn(); }
function startPlay(){
  if(now>=960) setT(0);
  playing=true; playBtn(); clearInterval(rt);
  dwellUntil=performance.now()+900/speed;
  rt=setInterval(()=>{
    if(performance.now()<dwellUntil) return;
    const nxt=now+rateAt(now)*speed;
    const kf=KF.find(k=>k>now && k<=nxt);
    if(kf!==undefined){ setT(kf); dwellUntil=performance.now()+1150/speed; }
    else setT(Math.min(960,nxt));
    if(now>=960) stopPlay();
  },60);
}

});

function bx(key,label,conf,state){return Object.assign({},SC.BOX[key],{label,conf,state});}

function detsFor(st,view){
  const d=[];
  const show=k=>view==='all'||view===k;
  if(show('yard')){
    d.push(st.covered?bx('heap','tarpaulin',0.96,'ok'):bx('heap','spoil_heap',0.93,'bad'));
    if(st.dust>0.32) d.push(bx('dustzone','visible_dust',Math.min(0.94,0.55+st.dust*0.45),'bad'));
    if(st.spraying) d.push(bx('mist','spray_plume',0.74,'ok'));
  }
  if(show('perim')) d.push(bx('fence','perimeter_barrier',0.97,'ok'));
  if(show('gate')){
    d.push(st.sheeted?bx('truck','load_sheeted',0.88,'ok'):bx('truck','load_uncovered',0.71,'warn'));
    d.push(bx('wash','wheel_wash_bay',0.79,'ok'));
  }
  return d;
}
function layerOf(l){return {spoil_heap:'L2',tarpaulin:'L2',visible_dust:'L2',perimeter_barrier:'L1',
  load_sheeted:'L2',load_uncovered:'L2',wheel_wash_bay:'L4',spray_plume:'L3'}[l]||'';}

      <span class="bar"><i style="width:${(b.conf*100).toFixed(0)}%;background:${c}"></i></span>

}

/* ---- risk model camera ---- */
function renderCamSim(p,dir){
  const st={covered:cState.L2,spraying:cState.L3,sheeted:cState.L2,
            dust:Math.max(0.04,Math.min(0.95,p*1.05)),
            drift:Math.sin(((dir+180)%360)*Math.PI/180),
            time:'13:00:00',cam:LANG==='en'?'CAM-02 · FORECAST 13:00 TOMORROW':'CAM-02 · DỰ BÁO 13:00 NGÀY MAI',boxes:[]};
  $('#camSim').innerHTML=SC.frame(st,LANG);
  const kind=p>=.6?'bad':p>=.3?'warn':'ok';
  setBanner($('#simBanner'),kind,t('cam.bnRisk')+' '+(p*100).toFixed(0)+'% · '+bandName(p));
}

/* ---- incident replay camera ---- */
function renderCamRp(){
  const n=now;
  const covered=n>=760;
  const dust=covered?Math.max(0.05,0.62-(n-760)/300):Math.min(0.72,Math.max(0,(n-8)/70));
  const st={covered,spraying:false,sheeted:true,dust,drift:0.5,
            cam:tv([CAMS[0][0],CAMS[0][1]]),
            time:(()=>{const d=new Date(2026,7,12,14,22,0);d.setSeconds(d.getSeconds()+n);
              return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');})()};
  let b=[];
  if(n>=45&&n<90) b=[Object.assign(bx('dustzone','visible_dust',0.61,'scan'))];
  else if(n>=90&&n<102) b=[bx('heap','spoil_heap',0.93,'scan'),bx('dustzone','visible_dust',0.86,'scan')];
  else if(n>=102&&n<760) b=[bx('heap','spoil_heap',0.94,'bad'),bx('dustzone','visible_dust',0.86,'bad'),bx('fence','perimeter_barrier',0.97,'ok')];
  else if(n>=760) b=[bx('heap','tarpaulin',0.96,'ok'),bx('fence','perimeter_barrier',0.97,'ok')];
  st.boxes=b;
  $('#camRp').innerHTML=SC.frame(st,LANG);
  let kind='warn',txt='';
  if(n<45) txt='';
  else if(n<102){kind='warn';txt=t('cam.bnScan');}
  else if(n<760){kind='bad';txt=t('cam.bnFind');}
  else if(n<900){kind='warn';txt=t('cam.bnFix');}
  else {kind='ok';txt=t('cam.bnVer');}
  setBanner($('#rpBanner'),kind,txt);
}

}

function frame(ts){ if(t0===null)t0=ts; var t=(ts-t0)/1000;
  while(fired<EV.length&&EV[fired].t<=t){EV[fired].f();fired++;}
  q('znProg').style.width=Math.min(100,(t/DUR)*100)+'%';
  if(t<DUR) raf=requestAnimationFrame(frame);
  else { running=false; q('znPlay').textContent=z().replay; } }
function znStart(){ if(running)return; running=true;t0=null;raf=requestAnimationFrame(frame); q('znPlay').textContent=z().running; }
function znReset(){
  if(raf)cancelAnimationFrame(raf);
  running=false;t0=null;fired=0;SENT.length=0;CK[1]=false;CK[2]=false;
  Object.keys(LASTV).forEach(function(k){delete LASTV[k];});
  renderChat();typing(false);
  Array.prototype.forEach.call(document.querySelectorAll('#znDay .znmo'),function(e){e.classList.remove('on','act');});
  ['1','2','3','4'].forEach(function(i){q('znvt'+i).className='znvt';});
  q('znn1').innerHTML='0 <small>'+z().mil+'</small>'; q('znn2').innerHTML='0<small>/0</small>';
  q('znn3').innerHTML='– <small>/100</small>'; q('znn4').innerHTML='–';
  q('znbf1').style.width='0';q('znbf2').style.width='0';
  q('znEvid').classList.remove('on'); q('znProg').style.width='0';
  q('znPlay').textContent=z().play;
}
function ST(id,val){ var e=q(id); if(e) e.textContent=val; }
function znRender(){
  var L=z();
  ST('znWho',L.who); ST('znReset',L.reset);
  ST('znOa',L.oa); ST('znCap',L.cap);
  ST('znValT',L.valT);
  ['znL1','znL2','znL3','znL4'].forEach(function(id,i){ST(id,L.v[i]);});
  ST('znB1',L.b1); ST('znB2',L.b2);
  ST('znEvT',L.evT); ST('znEv1',L.ev1);
  ST('znEv2',L.ev2); ST('znEv3',L.ev3);
  renderChat();
  Object.keys(LASTV).forEach(function(id){ var e=q('znn'+id); if(e) e.innerHTML=LASTV[id].fmt(LASTV[id].to); });
  ST('znPlay', running ? L.running : (fired>=EV.length ? L.replay : L.play));
  // restore active moment styling after a re-render
  var n=0; if(fired>0){ [[1,0],[2,3],[3,6],[4,9],[5,16],[6,21]].forEach(function(p){ if(fired>p[1]) n=p[0]; }); }
  if(n) mo(n);
}
q('znPlay').onclick=function(){ if(!running&&fired>=EV.length) znReset(); znStart(); };
q('znReset').onclick=znReset;
Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.addEventListener('click',function(){ setTimeout(znRender,0); }); });
znReset(); znRender();
})();
</script>
